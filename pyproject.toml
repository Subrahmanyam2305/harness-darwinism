[project]
name = "harness-darwinism"
version = "0.1.0"
description = "Genetic algorithm for evolving LLM agent harnesses on Crafter"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "crafter>=1.8",
    "openai>=1.30",
    "anthropic>=0.30",
    "pymongo[srv]>=4.7",
    "motor>=3.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "Pillow>=10.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
